name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Independent protocol and production parser conformance
        run: |
          python3 -m unittest discover -s protocol -p 'test_*.py' -v
          python3 tools/test_firmware_protocol.py
      - name: Firmware host behavior tests
        run: |
          cmake -S firmware/tests -B firmware/tests/build
          cmake --build firmware/tests/build
          ctest --test-dir firmware/tests/build --output-on-failure
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired SDK package "tools", which is no longer available.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, lint and APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Car-Companion-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v4
      - name: ESP32-C6 cross-build
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          idf.py set-target esp32c6
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: Car-Companion-firmware
          path: |
            firmware/build/*.bin
            firmware/build/flasher_args.json
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
